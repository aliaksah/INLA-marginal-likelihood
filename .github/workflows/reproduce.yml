name: Reproduce INLA Marginal Likelihood Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  reproduce:
    name: Reproduce on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Optimize Network and Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Force IPv4 for apt to prevent 30s IPv6 connection timeouts on Azure runners
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4
          # Replace throttling Azure mirrors with main Ubuntu archive
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo sed -i 's|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          # Pre-install system dependencies required by sf/units/fmesher/INLA
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev
          sudo ldconfig

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R Dependencies
        run: |
          Rscript -e '
            cran_pkgs <- c("MASS", "geepack", "MCMCpack", "coda", "Matrix", "mvtnorm", "statmod")
            # Uses fast pre-compiled binaries: RSPM on Linux and CRAN on macOS
            install.packages(cran_pkgs)
            install.packages("INLA", repos = c(getOption("repos"), INLA = "https://inla.r-inla-download.org/R/stable"), dep = TRUE)
          '

      - name: Execute Full Reproduction Pipeline
        env:
          QUICK: "1"
        run: |
          Rscript run_all.R

      - name: Upload Reproduction Logs and Results
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            results/*.csv
            logs/*.txt
            apppic/*.pdf
